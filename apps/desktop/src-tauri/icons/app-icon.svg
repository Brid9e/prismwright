     给 `tauri icon` 当输入用，由它派生出 icons/ 下各平台尺寸（icns/ico/png）。
     构成：居中的卡皮巴拉 logo（本体取自 src/assets/cardbara-logo.svg，不带字标），图形用
     品牌绿 #00D758；**不铺底色**——留透明，让系统按当前明暗外观决定图标底板，鲜亮的绿在浅色
     与深色底板上都清晰。早先试过「白底 + 黑 logo」，在 macOS 26+ 的暗色图标处理下黑图形压到
     深底板上，直接看不见。
     改图标只改这里，然后重跑： pnpm -F cardbara tauri icon src-tauri/icons/app-icon.svg -->
